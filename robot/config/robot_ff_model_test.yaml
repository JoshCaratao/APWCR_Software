comms:
  port: COM5
  baud: 230400
  timeout_s: 0.03
  write_timeout_s: 0.03

test:
  # Options: drive_lhs, drive_rhs, mech_rhs, mech_lhs
  motor_under_test: mech_rhs

  # Start with duty; can support pwm later if needed
  command_mode: duty

  # Options: positive, negative, both
  sweep_direction: positive

  # Fixed Python command refresh rate
  command_hz: 50.0

  # Fixed Python telemetry poll / logging rate
  telemetry_hz: 30.0

  # Hold zero briefly after opening serial so reset twitch can die out
  startup_settle_s: 2

  # For no-stop sweeps, briefly command a duty above breakaway so the motor is
  # already moving before the running-region sweep begins.
  no_stop_prespin_s: 1.5
  no_stop_prespin_duty: 0.40

  # Wait for motor speed to settle after each new command
  settle_s: 1.0

  # Time window to log data for the current step
  sample_s: 1.0

  # Optionally pause at zero between steps so each point starts from rest
  stop_between_steps_s: 0


  # Used automatically when stop_between_steps_s == 0
  positive_sweep_no_stop:
    - 0.38
    - 0.40
    - 0.45
    - 0.50
    - 0.55

  negative_sweep_no_stop:
    - -0.275
    - -0.30
    - -0.35
    - -0.40
    - -0.45

  
  # Used automatically when stop_between_steps_s > 0
  positive_sweep_with_stop:
    - 0.25
    - 0.275
    - 0.30
    - 0.35
    - 0.40
    - 0.45


  negative_sweep_with_stop:
    - -0.25
    - -0.275
    - -0.30
    - -0.35
    - -0.40


logging:
  # CSV output location for raw sweep data
  output_dir: robot/python/feedforward_model_test/data/raw

  # Base filename before optional timestamp suffix
  file_stem: ff_model_test

  append_timestamp: true
