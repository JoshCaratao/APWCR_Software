; PlatformIO Project Configuration File
;
; Feedforward motor identification firmware for the Arduino Mega 2560.

[env:megaatmega2560]

; ===== Target Platform =====
platform = atmelavr
board = megaatmega2560
framework = arduino

; ===== Serial Monitor =====
monitor_speed = 230400

; ===== Compiler Settings =====
build_flags =
    -std=gnu++17
    -Wall

; ===== Library Dependencies =====
lib_deps =
    bblanchon/ArduinoJson@^6.21.5
